<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Music Together</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
</head>
<body>

<!-- ========== HOME SCREEN ========== -->
<div id="home" class="screen active">
    <div class="home-bg"></div>
    <div class="home-content">
        <div class="logo">
            <div class="logo-icon">🎵</div>
            <h1>Music Together</h1>
            <p class="tagline">Dengarkan musik bareng, real-time, kualitas jernih.</p>
        </div>

        <div class="home-actions">
            <button id="btn-create" class="btn btn-primary btn-large">
                <span class="btn-icon">＋</span> Buat Ruangan
            </button>

            <div class="divider"><span>atau</span></div>

            <div class="join-box">
                <input id="input-code" type="text" placeholder="Masukkan kode ruangan…"
                       maxlength="6" autocomplete="off" spellcheck="false">
                <button id="btn-join" class="btn btn-accent">Gabung</button>
            </div>
            <p id="join-status" class="join-status"></p>
        </div>

        <p class="home-hint">Buat ruangan untuk jadi DJ, atau gabung dengan kode.</p>
    </div>
</div>

<!-- ========== ROOM SCREEN ========== -->
<div id="room" class="screen">
    <!-- Header -->
    <header class="room-header">
        <div class="header-left">
            <button id="btn-leave" class="btn-icon-only" title="Keluar">↩</button>
            <div class="room-info">
                <span class="room-label">Ruangan</span>
                <span id="room-code" class="room-code" title="Klik untuk salin">—————</span>
            </div>
        </div>
        <div class="header-right">
            <span id="listener-count" class="listener-badge">👥 0</span>
        </div>
    </header>

    <!-- Main Content -->
    <div class="room-body">
        <!-- Left: Player -->
        <div class="player-panel">
            <!-- Screen Share -->
            <div id="screen-panel" class="screen-panel hidden">
                <span class="screen-live"><span class="live-dot"></span> LIVE</span>
                <video id="screen-video" autoplay muted playsinline></video>
                <button id="btn-stop-screen" class="screen-stop" hidden>■ Stop</button>
            </div>

            <!-- Now Playing Card -->
            <div class="now-playing">
                <div class="album-art" id="album-art">
                    <div class="album-placeholder">♪</div>
                </div>
                <div class="track-info">
                    <div id="track-title" class="track-title">Belum ada lagu</div>
                    <div id="track-artist" class="track-artist">Upload musik untuk mulai</div>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="progress-container">
                <span id="time-current" class="time">0:00</span>
                <div id="progress-bar" class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                    <div id="progress-thumb" class="progress-thumb"></div>
                </div>
                <span id="time-duration" class="time">0:00</span>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button id="btn-shuffle" class="ctrl-btn" title="Acak">⇄</button>
                <button id="btn-prev" class="ctrl-btn" title="Sebelumnya">⏮</button>
                <button id="btn-play" class="ctrl-btn ctrl-play" title="Play / Pause">▶</button>
                <button id="btn-next" class="ctrl-btn" title="Selanjutnya">⏭</button>
                <button id="btn-repeat" class="ctrl-btn" title="Ulangi">↻</button>
            </div>

            <!-- Volume -->
            <div class="volume-row">
                <span class="vol-icon">🔊</span>
                <input id="volume-slider" type="range" min="0" max="100" value="75" class="slider">
            </div>

            <!-- Koneksi (diagnostik) -->
            <div id="conn-status" class="conn-status">—</div>
        </div>

        <!-- Right: Queue & Listeners -->
        <div class="side-panel">
            <!-- DJ Controls (only visible for DJ) -->
            <div id="dj-controls" class="panel-section dj-only hidden">
                <h3 class="section-title">DJ Controls</h3>
                <label class="upload-area" id="upload-area">
                    <input id="file-input" type="file" accept="audio/*" multiple hidden>
                    <div class="upload-content">
                        <span class="upload-icon">📎</span>
                        <span>Klik atau seret file musik ke sini</span>
<span class="upload-hint">MP3, FLAC, WAV, OGG — maks 50MB per file</span>
                        </div>
                    </label>
                    <button id="btn-share-screen" class="btn btn-accent btn-share">🖥️ Share Screen</button>
                </div>

            <!-- Queue -->
            <div class="panel-section">
                <h3 class="section-title">Antrian <span id="queue-count">(0)</span></h3>
                <ul id="queue-list" class="queue-list">
                    <li class="queue-empty">Belum ada lagu</li>
                </ul>
            </div>

            <!-- Listeners -->
            <div class="panel-section">
                <h3 class="section-title">Pendengar</h3>
                <ul id="listener-list" class="listener-list"></ul>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>
</div>

<!-- Hidden Audio Element -->
<audio id="audio" preload="auto" playsinline></audio>
<button id="tap-to-hear" hidden>🔊 Klik untuk mendengar</button>

<script src="js/app.js"></script>
</body>
</html>
